<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macros">
<title>Macros</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f0f0eb;
    --border: #ddddd8;
    --accent: #1a1a1a;
    --accent2: #d93025;
    --text: #1a1a1a;
    --muted: #888;
    --protein: #d93025;
    --carbs: #c8860a;
    --fat: #0077aa;
    --fiber: #6b48c8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .logo { font-size: 1rem; font-weight: 800; letter-spacing: -0.03em; }
  .logo span { color: var(--accent); }

  .header-date {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  /* Container */
  .container { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  /* Tabs */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .tab {
    padding: 13px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }

  .tab.active {
    background: var(--surface2);
    color: #2a7d4f;
    border-bottom: 2px solid #2a7d4f;
  }

  /* Panels */
  .tab-panel { display: none; }
  .tab-panel.active { display: flex; flex-direction: column; gap: 12px; }

  /* Card wrapper */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }

  /* Drop zone */
  .drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s;
  }

  .drop-zone.has-image { padding: 0; border-style: solid; border-color: var(--accent); overflow: hidden; }
  .drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2; }

  .drop-icon { font-size: 2rem; margin-bottom: 6px; }
  .drop-text { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
  .drop-text strong { color: var(--text); display: block; margin-bottom: 2px; }

  #preview-img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display: none;
    border-radius: 10px;
  }

  .change-photo {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(0,0,0,0.7);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    font-size: 0.7rem;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    padding: 5px 10px;
    cursor: pointer;
    display: none;
    z-index: 3;
  }

  /* Inputs */
  .input-row { display: flex; gap: 10px; align-items: flex-end; }

  .field { display: flex; flex-direction: column; gap: 5px; flex: 1; }

  .field label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
  }

  .field input, .field textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 13px 14px;
    outline: none;
    width: 100%;
    -webkit-appearance: none;
    transition: border-color 0.2s;
  }

  .field input:focus, .field textarea:focus { border-color: var(--accent); }

  .field textarea {
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    line-height: 1.65;
    min-height: 110px;
    resize: none;
  }

  /* Buttons */
  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    padding: 14px 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
    width: 100%;
    margin-top: 4px;
  }

  .btn-primary:active { opacity: 0.8; }
  .btn-primary:disabled { opacity: 0.35; }

  .btn-copy {
    background: var(--surface2);
    color: var(--accent);
    border: 2px solid #2a7d4f;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 10px 16px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-copy:active { background: var(--accent); color: #ffffff; }
  .btn-copy.copied { background: var(--accent); color: #ffffff; }

  /* Loading */
  .loading {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    font-size: 0.85rem;
    color: #666;
  }
  .loading.show { display: flex; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: #2a7d4f;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error {
    background: rgba(240,77,110,0.1);
    border: 1px solid var(--accent2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.8rem;
    color: var(--accent2);
    display: none;
  }
  .error.show { display: block; }

  /* Result */
  .result-card {
    background: var(--surface2);
    border: 2px solid #2a7d4f;
    border-radius: 14px;
    padding: 16px;
    display: none;
    animation: fadeUp 0.25s ease;
  }
  .result-card.show { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .macros-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }

  .macro-box {
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 4px;
    text-align: center;
  }

  .macro-box .ml { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #666; margin-bottom: 3px; }
  .macro-box .mv { font-family: 'DM Mono', monospace; font-size: 1rem; font-weight: 600; }
  .macro-box.kcal .mv { color: #2a7d4f; }
  .macro-box.prot .mv { color: var(--protein); }
  .macro-box.carb .mv { color: var(--carbs); }
  .macro-box.fat  .mv { color: var(--fat); }
  .macro-box.fib  .mv { color: var(--fiber); }

  .result-notes {
    font-size: 0.82rem;
    color: #555;
    line-height: 1.7;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-bottom: 12px;
  }

  .result-actions {
    display: flex;
    gap: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">MACRO<span>.</span></div>
  <div class="header-date" id="header-date"></div>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('photo', this)">📷 Foto</button>
    <button class="tab" onclick="switchTab('recipe', this)">📋 Receita</button>
  </div>

  <!-- Photo -->
  <div class="tab-panel active" id="panel-photo">
    <div class="drop-zone" id="drop-zone">
      <input type="file" accept="image/*" id="file-input" onchange="handleFile(this)">
      <div id="drop-placeholder">
        <div class="drop-icon">🍽️</div>
        <div class="drop-text"><strong>Toca para adicionar foto</strong>Câmara ou galeria</div>
      </div>
      <img id="preview-img" alt="preview">
      <button class="change-photo" id="change-photo-btn" onclick="changePhoto(event)">✎ Alterar</button>
    </div>

    <div class="field">
      <label>Peso (g)</label>
      <input type="number" id="photo-weight" placeholder="350" inputmode="numeric">
    </div>
    <div class="field">
      <label>Descrição (opcional)</label>
      <textarea id="photo-desc" placeholder="ex: frango grelhado com arroz e legumes&#10;Descreve o prato ou ingredientes visíveis"></textarea>
    </div>

    <button class="btn-primary" onclick="analyzePhoto()" id="btn-photo">Analisar</button>

    <div class="loading" id="loading-photo"><div class="spinner"></div> A analisar imagem...</div>
    <div class="error" id="error-photo"></div>

    <div class="result-card" id="result-photo">
      <div class="result-name" id="rp-name"></div>
      <div class="macros-grid" id="rp-macros"></div>
      <div class="result-notes" id="rp-notes"></div>
      <div class="result-actions">
        <button class="btn-copy" onclick="copyResult('photo')" id="copy-photo">
          <span>⎘</span> Copiar
        </button>
      </div>
    </div>
  </div>

  <!-- Recipe -->
  <div class="tab-panel" id="panel-recipe">
    <div class="field">
      <label>Ingredientes com pesos ou descrição do prato</label>
      <textarea id="recipe-text" placeholder="Ex:&#10;150g peito de frango grelhado&#10;80g arroz branco cozido&#10;100g brócolos&#10;10g azeite"></textarea>
    </div>

    <div class="field">
      <label>Peso total (g) — opcional</label>
      <input type="number" id="recipe-weight" placeholder="ex: 400" inputmode="numeric">
    </div>

    <button class="btn-primary" onclick="analyzeRecipe()" id="btn-recipe">Analisar</button>

    <div class="loading" id="loading-recipe"><div class="spinner"></div> A calcular macros...</div>
    <div class="error" id="error-recipe"></div>

    <div class="result-card" id="result-recipe">
      <div class="result-name" id="rr-name"></div>
      <div class="macros-grid" id="rr-macros"></div>
      <div class="result-notes" id="rr-notes"></div>
      <div class="result-actions">
        <button class="btn-copy" onclick="copyResult('recipe')" id="copy-recipe">
          <span>⎘</span> Copiar
        </button>
      </div>
    </div>
  </div>

</div>

<script>
let photoBase64 = null;
let pendingResult = { photo: null, recipe: null };

// Date
const d = new Date();
document.getElementById('header-date').textContent =
  d.toLocaleDateString('pt-PT', { weekday: 'short', day: 'numeric', month: 'short' });

// Tabs
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

// File
function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('preview-img');
    img.src = e.target.result;
    img.style.display = 'block';
    photoBase64 = e.target.result.split(',')[1];
    document.getElementById('drop-placeholder').style.display = 'none';
    document.getElementById('change-photo-btn').style.display = 'block';
    document.getElementById('drop-zone').classList.add('has-image');
  };
  reader.readAsDataURL(file);
}

function changePhoto(e) {
  e.stopPropagation();
  document.getElementById('file-input').click();
}

// API
async function callClaude(messages) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: `És um nutricionista especialista em contagem de macros. Responde SEMPRE em JSON válido sem markdown, sem backticks, sem texto fora do JSON.
Formato obrigatório:
{
  "name": "Nome do prato",
  "kcal": número,
  "protein": número em gramas,
  "carbs": número em gramas,
  "fat": número em gramas,
  "fiber": número em gramas,
  "notes": "nota breve sobre estimativa ou qualidade nutricional (max 2 frases)"
}
Usa valores reais com base em USDA/INSA. Se o peso não for dado, estima pela porção típica.`,
      messages
    })
  });
  if (!res.ok) throw new Error('API ' + res.status);
  const data = await res.json();
  const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
  return JSON.parse(text.replace(/```json|```/g, '').trim());
}

async function analyzePhoto() {
  if (!photoBase64) { showError('photo', 'Adiciona uma foto primeiro.'); return; }
  const weight = document.getElementById('photo-weight').value;
  const desc = document.getElementById('photo-desc').value;
  setLoading('photo', true);
  try {
    const r = await callClaude([{ role: 'user', content: [
      { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: photoBase64 } },
      { type: 'text', text: `Analisa esta refeição.${weight ? ` Peso: ${weight}g.` : ''}${desc ? ` Descrição: ${desc}.` : ''} Devolve JSON com macros.` }
    ]}]);
    pendingResult.photo = r;
    renderResult('photo', r);
  } catch(e) {
    showError('photo', 'Erro ao analisar. Tenta novamente.');
  } finally {
    setLoading('photo', false);
  }
}

async function analyzeRecipe() {
  const text = document.getElementById('recipe-text').value.trim();
  if (!text) { showError('recipe', 'Introduz a receita ou ingredientes.'); return; }
  const weight = document.getElementById('recipe-weight').value;
  setLoading('recipe', true);
  try {
    const r = await callClaude([{ role: 'user', content:
      `Receita:\n${text}${weight ? `\nPeso total: ${weight}g.` : ''}\nCalcula os macros e devolve JSON.`
    }]);
    pendingResult.recipe = r;
    renderResult('recipe', r);
  } catch(e) {
    showError('recipe', 'Erro ao calcular. Tenta novamente.');
  } finally {
    setLoading('recipe', false);
  }
}

function renderResult(type, r) {
  const p = type === 'photo' ? 'rp' : 'rr';
  document.getElementById(p + '-name').textContent = r.name;
  document.getElementById(p + '-macros').innerHTML = `
    <div class="macro-box kcal"><div class="ml">kcal</div><div class="mv">${Math.round(r.kcal)}</div></div>
    <div class="macro-box prot"><div class="ml">Prot.</div><div class="mv">${Math.round(r.protein)}g</div></div>
    <div class="macro-box carb"><div class="ml">HC</div><div class="mv">${Math.round(r.carbs)}g</div></div>
    <div class="macro-box fat"><div class="ml">Gord.</div><div class="mv">${Math.round(r.fat)}g</div></div>
    <div class="macro-box fib"><div class="ml">Fibra</div><div class="mv">${Math.round(r.fiber)}g</div></div>
  `;
  document.getElementById(p + '-notes').textContent = r.notes || '';
  document.getElementById('result-' + type).classList.add('show');
  hideError(type);
  // scroll to result
  document.getElementById('result-' + type).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function copyResult(type) {
  const r = pendingResult[type];
  if (!r) return;
  const text = `${r.name}\n${Math.round(r.kcal)} kcal | Prot: ${Math.round(r.protein)}g | HC: ${Math.round(r.carbs)}g | Gord: ${Math.round(r.fat)}g | Fibra: ${Math.round(r.fiber)}g`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-' + type);
    btn.classList.add('copied');
    btn.innerHTML = '<span>✓</span> Copiado!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<span>⎘</span> Copiar';
    }, 2000);
  }).catch(() => {
    // Fallback for older iOS
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

function setLoading(type, show) {
  document.getElementById('loading-' + type).classList.toggle('show', show);
  document.getElementById('btn-' + type).disabled = show;
  if (show) document.getElementById('result-' + type).classList.remove('show');
}

function showError(type, msg) {
  const el = document.getElementById('error-' + type);
  el.textContent = msg; el.classList.add('show');
}

function hideError(type) {
  document.getElementById('error-' + type).classList.remove('show');
}
</script>
</body>
</html>
